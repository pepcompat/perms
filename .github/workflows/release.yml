name: Release

# trigger เมื่อ push tag แบบ v1.0.1 (หรือสั่งรันเองจากหน้า Actions)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'runner ที่จะ build (JSON) เช่น ["macos-latest"] — เว้นว่าง = ทุกตัว'
        required: false
        default: ''
      publish:
        description: 'อัปโหลดขึ้น perms-desktop (false = build/sign ทดสอบเฉย ๆ)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 = Visual Studio 2022 (v17) ที่ node-gyp รองรับ
        # (windows-latest เลื่อนไป VS 18 ที่ node-gyp ยัง detect ไม่ได้)
        # สั่งรันเองเลือกเฉพาะบาง runner ได้ (เช่น build mac ใหม่ตัวเดียวหลังพัง)
        os: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["macos-latest","windows-2022","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}

    env:
      # บังคับ node-gyp ให้ target VS 2022 (กัน auto-detect ล้ม/buffer overflow)
      npm_config_msvs_version: '2022'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Python 3.11 ยังมี distutils ที่ node-gyp ต้องใช้ build native modules
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure setuptools (distutils shim)
        run: python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      # import cert เข้า keychain ที่สร้างเองตามแบบที่ GitHub แนะนำ แทนให้ electron-builder สร้าง temp keychain
      # (runner macOS ตั้งแต่ ต.ค. 2026 ปลดล็อก keychain ที่ electron-builder สร้างไม่ได้:
      #  "SecKeychainUnlock: The user name or passphrase you entered is not correct")
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_BASE64" ]; then echo "no cert — unsigned build"; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/perms-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MAC_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build & publish
        env:
          # PAT ที่มีสิทธิ์ contents:write ของ repo perms-desktop
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # mac: cert อยู่ใน keychain จากขั้นก่อนแล้ว — electron-builder หา Developer ID identity เอง
          # (ไม่ส่ง CSC_LINK เพื่อไม่ให้มันสร้าง temp keychain ของตัวเองที่พังบน runner ใหม่)
          # notarization (afterSign hook อ่านค่าพวกนี้ — runner อื่นจะถูกข้าม)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "false" ]; then
            pnpm exec electron-vite build && pnpm exec electron-builder --publish never
          else
            pnpm run release
          fi
